[advanced]
# Extra Vivado implementation reports requested during v++ --link.
# These reports are generated from the implemented design and copied into the
# Vitis temporary/report tree when the hardware link keeps the relevant run data.
misc=report=type report_timing_summary name impl_report_timing_summary_route_design steps {route_design} runs {impl_1} options {-max_paths 10 -report_unconstrained}
misc=report=type report_timing_summary name impl_report_timing_summary_post_route_phys_opt_design steps {post_route_phys_opt_design} runs {impl_1} options {-max_paths 10 -report_unconstrained}
misc=report=type report_utilization name impl_report_utilization_route_design steps {route_design} runs {impl_1} options {-hierarchical -hierarchical_depth 4}
misc=report=type report_power name impl_report_power_route_design steps {route_design} runs {impl_1} options {}
misc=report=type report_methodology name impl_report_methodology_route_design steps {route_design} runs {impl_1} options {}
misc=report=type report_drc name impl_report_drc_route_design steps {route_design} runs {impl_1} options {}
